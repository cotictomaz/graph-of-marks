schema_version: 1
paper: Graph of Marks, AAAI 2026

published_algorithm:
  detector_min_confidence: 0.5
  wbf_iou: 0.9
  released_detector_weights:
    owlvit: 2.0
    yolov8: 1.5
    detectron2: 1.0
  released_post_wbf_label_nms: 0.5
  segmenter: SAM-HQ ViT-H
  depth: MiDaS DPT-Large
  direction_margin: 20
  depth_difference: 0.1
  near_distance: 5000
  touching_iou: 0.1
  touching_gap: 3
  very_close_distance: 0.05
  close_distance: 0.12
  query_object_similarity: 0.5
  query_relation_similarity: 0.5
  relations_per_head: 3

documented_correction:
  reason: Nested same-object boxes survive the released box-only NMS and corrupt Algorithm 3.
  post_sam_same_class_dedup:
    box_iou: 0.5
    mask_iou: 0.8
    containment: 0.9
    cross_class_suppression: false

published_decoding:
  seeds: [42, 123, 456]
  temperatures: [0.1, 0.3, 0.5]
  top_p: [0.7, 0.9, 0.95]
  max_tokens: 512
  combinations: cartesian

scoring_protocols:
  declared: Dataset-creator accuracy metrics
  primary_reconstruction: Official VQA consensus normalization
  released_vqa_code: Lowercase exact match against the single stored answer
  conflict: The released evaluator does not implement the VQA consensus metric described by the paper.

models:
  gemma3_4b:
    id: google/gemma-3-4b-it
    revision: 093f9f388b31de276ce2de164bdc2081324b9767
  qwen25_vl_7b:
    id: Qwen/Qwen2.5-VL-7B-Instruct
    revision: cc594898137f460bfe9f0759e9844b3ce807cfb5
  llamav_o1_11b:
    id: omkarthawakar/LlamaV-o1
    revision: 429fc3ea2bcda81d1c876ed4c80c20d7c14c5fec

conditions:
  raw:
    render_variant: null
  segmented:
    render_variant: segmented
  som_numeric:
    render_variant: som_numeric
  gom_text:
    render_variant: gom_text_unlabeled
  gom_numeric:
    render_variant: gom_numeric_unlabeled
  gom_text_labeled:
    render_variant: gom_text_labeled
  gom_numeric_labeled:
    render_variant: gom_numeric_labeled

released_artifact_conflict:
  description: The released VQAv2 artifacts do not encode the published Table 1 setup.
  prompt_profile: released_artifact_bare
  prompt: "Answer with only one word.\nQuestion: {question}\nAnswer:"
  observed_owl_threshold: 0.3
  observed_relation_limit: 1
  note: Report this compatibility run separately; never merge it with published-spec results.
