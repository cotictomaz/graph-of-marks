# Config for `train.sh configs/prompting_experiments.yaml` (see gom.ablations.main).
# Preprocesses images once with the default config, then evaluates each
# enabled prompting strategy on every model in `models` (see
# gom.ablations.run_experiments.run_prompting_experiments and
# gom.ablations.prompts.build_prompt_template).

# ==========================================
# Global settings
# ==========================================
base_dir: "/workspace/ablation_studies/prompting"
backend: "vllm"
n_runs: 3
num_examples: -1
force_reprocess: false

# Single flat VQAv1 JSON (list of {image_path, question, answers}).
dataset_path: "/workspace/vqav1_limited_1000.json"

# --- Image location (see README_SLURM.md §"Images live only on node 40") ---
# On node 40 (faretra), the images live locally: point images_dir at them and
# leave images_base_url empty — no downloads happen.
# On every OTHER node, leave images_dir as-is (it simply won't exist there) and
# set images_base_url to node 40's HTTP image server; each image is fetched once
# into image_cache_dir and reused thereafter.
images_dir: "/workspace/data/train2014"
images_base_url: ""            # e.g. "http://137.204.107.40:8000" when running off node 40
image_cache_dir: ""           # empty ⇒ defaults to {base_dir}/image_cache (must be under /workspace)

ablations:
  enabled: false

vlm_comparison:
  enabled: false

# ==========================================
# Prompting techniques experiment
# ==========================================
prompting:
  enabled: true
  skip_preprocessing: false  # true = images already exist at {base_dir}/preprocessed_images/prompting/default/

  # An entry may be a plain string (bf16) or a mapping with `fp8: true` to
  # FP8-quantize on load (see gom.ablations.models.parse_model_entry).
  models:
    - "Qwen/Qwen3-VL-8B-Instruct"        # reasoning OFF — instruct baseline
    - "Qwen/Qwen3-VL-8B-Thinking"        # reasoning ON, same weights → isolates CoT/graph_guided × reasoning
    - "omkarthawakar/LlamaV-o1"          # 2nd, independent reasoning model (CoT effect isn't Qwen-specific)

  # Optional preprocessing parameter overrides applied on top of the pipeline defaults.
  preprocessing_overrides: {}

  # Toggle strategies on/off, or tune their parameters (e.g. n_shots).
  # See src/gom/ablations/prompts.py for the full set of supported strategies
  # and what each `enabled: true` block accepts.
  strategies:
    baseline:
      enabled: true

    few_shot:
      enabled: true
      n_shots: 3

    chain_of_thought:
      enabled: true

    graph_guided:
      enabled: true
