# PREPROCESS-ONLY copy of prompting_experiments.yaml: same base_dir and the same
# preprocessing_overrides, but `models: []` so no VLM is ever loaded — main.py runs
# the preprocessing phase and then the prompting runner as a 0-model no-op.
# force_reprocess: true rebuilds the cached images with the current overrides.
# Keep preprocessing_overrides in sync with prompting_experiments.yaml, otherwise the
# images this writes are not the ones that config will read back.

# ==========================================
# Global settings
# ==========================================
base_dir: "/workspace/ablation_studies/prompting"
backend: "vllm"
n_runs: 3
num_images: 100       # how many unique images to keep; -1 = all images
questions_per_image: -1  # how many questions to keep per image; -1 = all questions
force_reprocess: true   # rebuild the cached images with the overrides below

# Single flat VQAv1 JSON (list of {image_path, question, answers}).
dataset_path: "/workspace/vqav1_limited_1000.json"

# --- Image location (see README_SLURM.md §2.1 "Images live only on node 40") ---
# The source images live OUTSIDE the repo (not under /workspace), so
# run_docker.sh bind-mounts them read-only at the fixed container path /images,
# driven by GOM_IMAGES_DIR / ~/.gom_images_dir on the node (set once on node 40).
#   * On node 40 (faretra): the mount provides /images; leave images_base_url
#     empty — no downloads happen.
#   * On every OTHER node: /images is absent (GOM_IMAGES_DIR unset), so set
#     images_base_url to node 40's HTTP image server; each image is fetched once
#     into image_cache_dir and reused thereafter.
images_dir: "/images"          # node-40 mount target (run_docker.sh -v "$GOM_IMAGES_DIR":/images:ro)
images_base_url: "http://137.204.107.40:8000"   # off-faretra nodes fetch images over HTTP from node 40 (needs its http.server up)
image_cache_dir: ""           # empty ⇒ defaults to {base_dir}/image_cache (must be under /workspace)

ablations:
  enabled: false

vlm_comparison:
  enabled: false

# ==========================================
# Prompting techniques experiment
# ==========================================
prompting:
  enabled: true
  skip_preprocessing: false  # true = images already exist at {base_dir}/preprocessed_images/prompting/default/

  # An entry may be a plain string (bf16) or a mapping carrying per-model load
  # overrides (see gom.ablations.models.parse_model_entry / ModelSpec):
  #     - name: "repo/id"
  #       fp8: false            # FP8-quantize on load (dead on the RTX 3090; use bf16)
  #       max_model_len: 8192   # context cap = KV size + HARD prompt-length ceiling;
  #                             #   size to the model's MEASURED max GoM-prompt length
  #                             #   (default 8192). Too small => "decoder prompt ...
  #                             #   longer than the maximum model length" on every request.
  #       max_pixels: 200704    # Qwen-style vision-token cap: shrinks the image's token
  #                             #   count so an oversized prompt fits max_model_len WITHOUT
  #                             #   spending KV. The real lever for Qwen3-VL's ~16k prompts.
  #       max_tokens: 512       # generation cap override (else auto by reasoning-model type)
  # Restore the reasoning-axis models below for the full run (mirror vlm_comparison
  # per-model sizing so their GoM prompts fit):
  #   - "Qwen/Qwen3-VL-8B-Instruct"      # reasoning OFF — instruct baseline
  #   - "Qwen/Qwen3-VL-8B-Thinking"      # reasoning ON, same weights → isolates CoT/graph_guided × reasoning
  #   - "omkarthawakar/LlamaV-o1"        # 2nd, independent reasoning model (CoT effect isn't Qwen-specific)
  # PREPROCESS-ONLY: empty => no vLLM engine is loaded and no inference runs.
  # The model list lives in prompting_experiments.yaml; run that config (with
  # skip_preprocessing: true) once these images are built.
  models: []

  # Optional preprocessing parameter overrides applied on top of the pipeline defaults.
  #
  # Paper-matching render/prune settings — applied to prompting ONLY (the ablation
  # grid in ablation_experiments.yaml is intentionally left on the code defaults).
  # These only take effect when the preprocessed set is (re)generated: set
  # skip_preprocessing: false and force_reprocess: true above to rebuild the
  # existing images, which were rendered with the old (divergent) defaults.
  #   * aggressive_pruning is the real fix — code default is False, but the paper
  #     prunes to question-relevant objects; without it every detection (up to
  #     max_detections_total=80) is marked, cluttering the image.
  #   * auto_scale_styles / max_relations already match the current code defaults
  #     (True / 10); pinned here so the paper run stays correct if defaults drift.
  #
  # Relation capping: enforce a GLOBAL budget of 10 relations per image and NO
  # per-object limit. max_relations alone does nothing — the global budget is only
  # applied when enforce_max_global is set, and without either enforce_* flag the
  # scene graph keeps every geometric edge, so the images showed far more than 10.
  # The capping settings below are kept identical to vlm_comparison.yaml (note the
  # two configs still differ on auto_scale_styles, so their images are NOT
  # interchangeable).
  #   * enforce_max_global: true      -> actually enforce max_relations (and prune the
  #                                     scene graph down to it, so graph.json, the
  #                                     triples text and the drawn arrows all agree).
  #   * enforce_max_per_object: true  -> take the plain-truncation branch, bypassing the
  #                                     per-object heuristics (auto_adjust_relation_cap,
  #                                     which otherwise pins the cap to 1, and the
  #                                     small-object cap of 2).
  #   * max_relations_per_object: 999 -> effectively no per-object limit; the 10 are
  #                                     chosen purely by importance (question-relevant
  #                                     first, then relation priority, then proximity).
  #                                     Do NOT use 0 — that means "drop all relations".
  preprocessing_overrides:
    aggressive_pruning: true
    auto_scale_styles: false
    max_relations: 10
    enforce_max_global: true
    enforce_max_per_object: true
    max_relations_per_object: 999

  # Toggle strategies on/off, or tune their parameters (e.g. n_shots).
  # See src/gom/ablations/prompts.py for the full set of supported strategies
  # and what each `enabled: true` block accepts.
  strategies:
    baseline:
      enabled: true

    few_shot:
      enabled: true
      n_shots: 3

    chain_of_thought:
      enabled: true

    graph_guided:
      enabled: true
