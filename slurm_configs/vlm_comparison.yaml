# Config for `train.sh configs/vlm_comparison.yaml` (see gom.ablations.main).
# Preprocesses images once with the default config (+ optional overrides),
# then runs every model in `models` on those images to compare VLM accuracy
# (see gom.ablations.run_experiments.run_vlm_comparison).

# ==========================================
# Global settings
# ==========================================
base_dir: "/workspace/ablation_studies/vlm_comparison"
backend: "vllm"
n_runs: 3
num_images: 100       # how many unique images to keep; -1 = all images
questions_per_image: -1  # how many questions to keep per image; -1 = all questions
force_reprocess: false  # use the already-generated preprocessed images (no preprocessing step)

# Optional question-level dataset filter, applied to the FULL dataset BEFORE the
# num_images/questions_per_image subsample (so num_images counts kept examples
# only). Keeps only questions that involve spatial reasoning — for testing the
# VLMs' spatial ability specifically. See gom.ablations.spatial_filter.
#   mode: "none" (default, no filter) | "spatial"
#   keywords:       [...]  # OPTIONAL: replace the default spatial lexicon entirely
#   extra_keywords: [...]  # OPTIONAL: add terms to the default lexicon
# ⚠️ For a raw-vs-preprocessed comparison, vlm_comparison_raw.yaml MUST use the
# SAME dataset_filter block, or the two runs score different example sets.
# dataset_filter:
#   mode: "spatial"

# Single flat VQAv1 JSON (list of {image_path, question, answers}).
dataset_path: "/workspace/vqav1_limited_1000.json"

# --- Image location (see README_SLURM.md §2.1 "Images live only on node 40") ---
# The source images live OUTSIDE the repo (not under /workspace), so
# run_docker.sh bind-mounts them read-only at the fixed container path /images,
# driven by GOM_IMAGES_DIR / ~/.gom_images_dir on the node (set once on node 40).
#   * On node 40 (faretra): the mount provides /images; leave images_base_url
#     empty — no downloads happen.
#   * On every OTHER node: /images is absent (GOM_IMAGES_DIR unset), so set
#     images_base_url to node 40's HTTP image server; each image is fetched once
#     into image_cache_dir and reused thereafter.
images_dir: "/images"          # node-40 mount target (run_docker.sh -v "$GOM_IMAGES_DIR":/images:ro)
images_base_url: "http://137.204.107.40:8000"   # off-faretra nodes fetch images over HTTP from node 40 (needs its http.server up)
image_cache_dir: ""           # empty ⇒ defaults to {base_dir}/image_cache (must be under /workspace)

ablations:
  enabled: false

# ==========================================
# VLM comparison experiment
# ==========================================
vlm_comparison:
  enabled: true
  skip_preprocessing: true  

  # Add/remove Hugging Face repo IDs here to change which models are compared.
  # An entry may be a plain string (loaded in bf16) or a mapping carrying per-model
  # load overrides (see gom.ablations.models.parse_model_entry / ModelSpec):
  #     - name: "repo/id"
  #       fp8: false                 # FP8-quantize on load (dead on the RTX 3090; use bf16)
  #       max_model_len: 8192        # context cap = KV size + HARD prompt-length ceiling;
  #                                  #   size to the model's MEASURED max GoM-prompt length.
  #                                  #   Too small => "decoder prompt ... longer than the
  #                                  #   maximum model length" on every request.
  #       max_pixels: 200704         # Qwen-style vision-token cap: shrinks the image's token
  #                                  #   count so a prompt fits max_model_len.
  #       max_tokens: 512            # generation cap override (else auto by reasoning-model type)
  #       gpu_memory_utilization: 0.96   # total-budget cap; raise toward 0.96 to buy KV for a
  #                                  #   model that only *just* fits (default 0.90)
  #       max_num_batched_tokens: 4096   # profiling/prefill-chunk cap; lower it to shrink the
  #                                  #   startup activation peak (must stay >= one image's tokens)
  #       limit_mm_per_prompt: {image: 1, video: 0}   # per-modality multimodal cap. video:0 is
  #                                  #   load-bearing for Qwen3-VL — see "config D" below.
  # main.py releases the GoM preprocessor's GPU memory after preprocessing (before
  # the VLM loop), so each model gets the full 24GB card at gpu_memory_utilization=0.90.
  #
  # Per-model status on the RTX 3090 (measured 2026-07-14 — see CLAUDE.md
  # "Qwen3-VL VRAM fit on the 3090" for the full lever analysis):
  #   * Qwen2.5-VL-7B  — WORKS (paper anchor; full-fidelity prompts ~12.7k–17.1k tok).
  #   * InternVL3.5-8B — WORKS (bf16, ~4k-tok prompts, leaves a ~33k-token KV cache).
  #   * Qwen3-VL-8B-Instruct — WORKS only as "config D" below: all THREE of
  #     limit_mm(video:0) + max_num_batched_tokens=4096 + gpu_memory_utilization=0.96
  #     are REQUIRED together (none alone loads). The dominant blocker is vLLM
  #     profiling the vision encoder with a *video* item at max feature size (a
  #     ~151k-token budget); limit_mm video:0 kills that. Thin headroom (~0.28GB
  #     free after inference) — drop max_model_len to ~12288 for more KV slack.
  #   * LlamaV-o1 (mllama) — DISABLED: not servable by vllm 0.11.0 + transformers 4.57.6.
  #   * gemma-3-12b-it   — DISABLED on 3090: OOMs at ~22.8GB just LOADING weights in
  #     bf16 (run it on the 5090). FP8 is dead on Ampere (Marlin needs dims /64;
  #     Qwen3-VL's 4304 fails).
  models:
  # 2026-07-14: this run is Qwen3-VL ONLY (vllm inference side, skip_preprocessing:
  # true → reads existing preprocessed images). Uncomment the anchors for the full
  # comparison.
    - name: "Qwen/Qwen2.5-VL-7B-Instruct"   # paper anchor (Qwen2.5-VL-7B)
      max_model_len: 24576                  #   must exceed the largest prompt (~17.1k) + generation
  # - name: "OpenGVLab/InternVL3_5-8B"      # bf16; ~4k-token prompts, ~33k-token KV — comfortable
  #   max_model_len: 8192

    # Qwen3-VL-8B-Instruct — "config D" (the ONLY config that fits 16384 ctx on a
    # 24GB 3090). All three knobs are required together; see the per-model notes above.
    # - name: "Qwen/Qwen3-VL-8B-Instruct"
    #   max_model_len: 17000        # 2026-07-14: raised 16384->17000 to clear the busiest
    #                               #   GoM prompts (observed up to 16969 tok; ~30% overflowed
    #                               #   16384 and scored 0). NB the KV pool is memory-bound, so
    #                               #   17000 also needs a higher util (below) or load fails with
    #                               #   "estimated max model length 16560".
    #   max_pixels: 200704          #   NB: this does NOT effectively cap Qwen3-VL's vision tokens
    #                               #   here — the ~16k prompt is ~15k VISION tokens (scene-graph
    #                               #   text is tiny). Cutting vision tokens is the real fix if this
    #                               #   still overflows / hangs (razor-thin ~0.1GB free at 17000).
    #   gpu_memory_utilization: 0.97  # 0.96 gave only 16,560-token KV (< 17000); 0.97 ≈ 17.8k-token
    #                               #   pool so a single 17000-token request fits. Thinner headroom.
    #   max_num_batched_tokens: 4096
    #   limit_mm_per_prompt: {image: 1, video: 0}
  #   - name: "omkarthawakar/LlamaV-o1"     # DISABLED: mllama unservable (vllm 0.11.0 + transformers 4.57.6)
  #   - name: "google/gemma-3-12b-it"       # DISABLED on 3090: OOMs loading bf16 weights; run on the 5090

  # Optional preprocessing parameter overrides applied on top of the pipeline
  # defaults (any field of gom.config.PreprocessorConfig). Leave empty ({})
  # to use the pipeline defaults unchanged.
  #
  # Paper-matching render/prune settings — applied to vlm_comparison ONLY (the
  # ablation grid in ablation_experiments.yaml is intentionally left on the code
  # defaults). These only take effect when the preprocessed set is (re)generated:
  # set skip_preprocessing: false and force_reprocess: true above to rebuild the
  # existing images, which were rendered with the old (divergent) defaults.
  #   * aggressive_pruning is the real fix — code default is False, but the paper
  #     prunes to question-relevant objects; without it every detection (up to
  #     max_detections_total=80) is marked, cluttering the image.
  #   * auto_scale_styles / max_relations already match the current code defaults
  #     (True / 10); pinned here so the paper run stays correct if defaults drift.
  #
  # Relation capping: enforce a GLOBAL budget of 10 relations per image and NO
  # per-object limit. max_relations alone does nothing — the global budget is only
  # applied when enforce_max_global is set, and without either enforce_* flag the
  # scene graph keeps every geometric edge, so the images showed far more than 10.
  #   * enforce_max_global: true      -> actually enforce max_relations (and prune the
  #                                     scene graph down to it, so graph.json, the
  #                                     triples text and the drawn arrows all agree).
  #   * enforce_max_per_object: true  -> take the plain-truncation branch, bypassing the
  #                                     per-object heuristics (auto_adjust_relation_cap,
  #                                     which otherwise pins the cap to 1, and the
  #                                     small-object cap of 2).
  #   * max_relations_per_object: 999 -> effectively no per-object limit; the 10 are
  #                                     chosen purely by importance (question-relevant
  #                                     first, then relation priority, then proximity).
  #                                     Do NOT use 0 — that means "drop all relations".
  preprocessing_overrides:
    aggressive_pruning: true
    auto_scale_styles: false
    max_relations: 10
    enforce_max_global: true
    enforce_max_per_object: true
    max_relations_per_object: 999

prompting:
  enabled: false