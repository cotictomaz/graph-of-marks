# Qwen2.5-VL INFERENCE on the spatial GoM preprocessed set. This file first built
# the images (models: [] + force_reprocess: true, preprocess-only); it now reads
# them back (skip_preprocessing: true) and runs Qwen2.5-VL over them with the full
# GoM condition (annotated image + scene-graph triples).
#
# Uses base_dir ablation_studies/vlm_comparison_spatial (where the preprocess job
# wrote the images) and never touches the original vlm_comparison outputs. The
# SPATIAL subset is defined by dataset_filter.mode=spatial + num_images/
# questions_per_image (250 unique images x 1 question) — kept identical to the
# preprocess run so it selects that exact example set. The vlm_comparison_spatial_raw
# baseline uses the same subset on the untouched source images.

# ==========================================
# Global settings
# ==========================================
base_dir: "/workspace/ablation_studies/vlm_comparison_spatial"
backend: "vllm"
n_runs: 3
num_images: 250          # how many unique images to keep; -1 = all images
questions_per_image: 1   # how many questions to keep per image; -1 = all questions
force_reprocess: false   # inference run: read the already-preprocessed images, don't rebuild

# Question-level dataset filter, applied to the FULL dataset BEFORE the
# num_images/questions_per_image subsample (so num_images counts kept examples
# only — 250 *spatial* images, not 250 arbitrary ones). See gom.ablations.spatial_filter.
dataset_filter:
  mode: "spatial"

# Single flat VQAv1 JSON (list of {image_path, question, answers}).
dataset_path: "/workspace/vqav1_limited_1000.json"

# --- Image location (see README_SLURM.md §2.1 "Images live only on node 40") ---
# moro232 is NOT node 40, so /images is absent and images_base_url must point at
# node 40's HTTP image server; each image is fetched once into image_cache_dir.
images_dir: "/images"          # node-40 mount target (absent on moro232)
images_base_url: "http://137.204.107.40:8000"   # moro232 fetches images over HTTP from node 40 (needs its http.server up)
image_cache_dir: ""           # empty ⇒ defaults to {base_dir}/image_cache (must be under /workspace)

ablations:
  enabled: false

# ==========================================
# VLM comparison experiment (PREPROCESS-ONLY)
# ==========================================
vlm_comparison:
  enabled: true
  skip_preprocessing: true  # true = read the existing preprocessed images (no preprocessing phase)

  # Run Qwen2.5-VL on the GoM preprocessed images from vlm_comparison_spatial.
  # Defaults give the full GoM condition: inference_image=preprocessed +
  # include_scene_graph=true (annotated image + scene-graph triples).
  # max_model_len sized to Qwen2.5-VL's full-fidelity GoM prompts (~17.1k) + generation.
  models:
    - name: "Qwen/Qwen2.5-VL-7B-Instruct"   # paper anchor (Qwen2.5-VL-7B)
      max_model_len: 24576

  # Paper-matching render/prune + relation-capping settings. Kept IDENTICAL to
  # vlm_comparison.yaml so the images this writes are exactly the ones that
  # config reads back. See vlm_comparison.yaml for the full rationale of each key.
  preprocessing_overrides:
    aggressive_pruning: true
    auto_scale_styles: false
    max_relations: 10
    enforce_max_global: true
    enforce_max_per_object: true
    max_relations_per_object: 999

prompting:
  enabled: false
